version: "3.8"
services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached

  db:
    image: mariadb:10.6
    restart: always
    volumes:
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: shopstock

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 80:80
    environment:
      - PMA_ARBITRARY=1
